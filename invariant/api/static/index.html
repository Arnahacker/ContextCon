<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invariant · Underwriting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem('inv-theme')||'dark';document.documentElement.dataset.theme=t})();</script>
<style>
/* ============================================================ tokens */
:root,[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1320;--bg2:#101827;--surface:#172235;--surface2:#1e2c40;--surface3:#24344b;
  --line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.09);--line3:rgba(148,163,184,.22);
  --ink:#f5f7fb;--ink2:#cbd5e1;--muted:#94a3b8;--faint:#64748b;
  --blue:#4d8dff;--blue-ink:#8db5ff;--blue-soft:rgba(77,141,255,.13);--blue-line:rgba(77,141,255,.38);
  --teal:#29c7b8;--teal-soft:rgba(41,199,184,.12);
  --good:#25c685;--good-ink:#5fe0a8;--good-soft:rgba(37,198,133,.12);--good-line:rgba(37,198,133,.35);
  --warn:#f5ae42;--warn-ink:#fbc778;--warn-soft:rgba(245,174,66,.12);--warn-line:rgba(245,174,66,.35);
  --bad:#f06a73;--bad-ink:#ff9aa1;--bad-soft:rgba(240,106,115,.12);--bad-line:rgba(240,106,115,.38);
  --hold:#8b9cff;--hold-soft:rgba(139,156,255,.13);--hold-line:rgba(139,156,255,.38);
  --neutral:#64748b;--neutral-soft:rgba(148,163,184,.10);--neutral-line:rgba(148,163,184,.25);
  --glass:rgba(23,34,53,.72);
  --grid:rgba(148,163,184,.05);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(2,6,23,.35);
  --shadow-lg:0 24px 60px rgba(2,6,23,.6);
  --hero:radial-gradient(1200px 500px at 85% -10%,rgba(77,141,255,.22),transparent 60%),radial-gradient(900px 420px at 0% 110%,rgba(41,199,184,.14),transparent 60%);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f6fb;--bg2:#eef2f8;--surface:#ffffff;--surface2:#f7f9fc;--surface3:#eef2f8;
  --line:#e2e8f0;--line2:#edf1f7;--line3:#cbd5e1;
  --ink:#0f172a;--ink2:#334155;--muted:#64748b;--faint:#94a3b8;
  --blue:#2f6fed;--blue-ink:#1d4fc4;--blue-soft:#eaf1ff;--blue-line:#bcd2fb;
  --teal:#0e9f92;--teal-soft:#e4f7f5;
  --good:#0f9f68;--good-ink:#0b7a50;--good-soft:#e7f8f0;--good-line:#b9e8d3;
  --warn:#d98b12;--warn-ink:#9a5f05;--warn-soft:#fdf4e3;--warn-line:#f3d59a;
  --bad:#de3f4a;--bad-ink:#b4232e;--bad-soft:#fdecee;--bad-line:#f6c2c6;
  --hold:#5b6cf0;--hold-soft:#eef0ff;--hold-line:#c9cffb;
  --neutral:#94a3b8;--neutral-soft:#f1f5f9;--neutral-line:#dbe3ec;
  --glass:rgba(255,255,255,.8);--grid:rgba(15,23,42,.035);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.06);--shadow-lg:0 24px 60px rgba(15,23,42,.16);
  --hero:radial-gradient(1200px 500px at 85% -10%,rgba(47,111,237,.12),transparent 60%),radial-gradient(900px 420px at 0% 110%,rgba(14,159,146,.10),transparent 60%);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;z-index:0;mask-image:linear-gradient(to bottom,#000 0%,transparent 70%)}
button{font:inherit;color:inherit}
a{color:var(--blue-ink);text-decoration:none}a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12px}.xs{font-size:11px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}

/* ============================================================ nav */
.nav{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--glass);border-bottom:1px solid var(--line)}
.nav-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:26px;padding:12px 28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.02em;font-size:15px;color:var(--ink);text-decoration:none!important}
.logo .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4d8dff 0%,#29c7b8 100%);display:grid;place-items:center;box-shadow:0 6px 18px rgba(77,141,255,.35)}
.logo small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.links{display:flex;gap:4px}
.links a{color:var(--muted);font-weight:550;font-size:13.5px;padding:7px 12px;border-radius:8px;text-decoration:none}
.links a:hover{color:var(--ink);background:var(--surface2)}
.links a.on{color:var(--ink);background:var(--surface2);box-shadow:inset 0 -2px 0 var(--blue)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 11px;background:var(--surface)}
.status i{width:7px;height:7px;border-radius:99px;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.icon-btn:hover{border-color:var(--line3)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
main{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:26px 28px 80px}
.page{animation:pagein .28s ease}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============================================================ primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);position:relative}
.card.lift{transition:transform .18s ease,border-color .18s ease}
.card.lift:hover{transform:translateY(-2px);border-color:var(--line3)}
.ch{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line2)}
.ch h3{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.005em}
.ch p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.ch .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.cb{padding:16px 18px}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--blue-soft);border:1px solid var(--blue-line)}
.ico svg{width:16px;height:16px;stroke:var(--blue-ink);fill:none;stroke-width:1.9}
.ico.teal{background:var(--teal-soft);border-color:rgba(41,199,184,.35)}.ico.teal svg{stroke:var(--teal)}
.ico.warn{background:var(--warn-soft);border-color:var(--warn-line)}.ico.warn svg{stroke:var(--warn)}
.ico.good{background:var(--good-soft);border-color:var(--good-line)}.ico.good svg{stroke:var(--good)}
.ico.bad{background:var(--bad-soft);border-color:var(--bad-line)}.ico.bad svg{stroke:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border:1px solid var(--line3);background:var(--surface2);color:var(--ink);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:transform .08s,background .15s,border-color .15s,box-shadow .15s;text-decoration:none!important}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#5b97ff 0%,#3f7ef5 100%);border-color:#3f7ef5;color:#fff;box-shadow:0 6px 18px rgba(77,141,255,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.primary:hover{box-shadow:0 8px 24px rgba(77,141,255,.45),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.ghost{background:transparent}
.btn.lg{padding:11px 20px;font-size:14px;border-radius:10px}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.1}
.btn:disabled{opacity:.55;cursor:progress}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:99px;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:6px;white-space:nowrap;border:1px solid transparent;letter-spacing:.01em}
.badge i{width:6px;height:6px;border-radius:99px;background:currentColor}
.b-good{background:var(--good-soft);color:var(--good-ink);border-color:var(--good-line)}
.b-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-line)}
.b-bad{background:var(--bad-soft);color:var(--bad-ink);border-color:var(--bad-line)}
.b-hold{background:var(--hold-soft);color:var(--hold);border-color:var(--hold-line)}
.b-neutral{background:var(--neutral-soft);color:var(--ink2);border-color:var(--neutral-line)}
.b-blue{background:var(--blue-soft);color:var(--blue-ink);border-color:var(--blue-line)}
.eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--blue-ink)}
.skel{background:linear-gradient(90deg,var(--surface2) 0%,var(--surface3) 50%,var(--surface2) 100%);background-size:200% 100%;animation:sh 1.3s ease-in-out infinite;border-radius:6px;color:transparent!important}
@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:650;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em;background:var(--surface2)}
td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr.click{cursor:pointer}
tbody tr:hover{background:var(--surface2)}
tr:last-child td{border-bottom:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(360px,1fr)}
.g2b{grid-template-columns:minmax(0,1.6fr) minmax(330px,1fr)}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.mt{margin-top:16px}
.val{color:var(--ink);cursor:pointer;font-weight:600;border-bottom:1px dotted var(--faint)}
.val:hover{color:var(--blue-ink);border-bottom-color:var(--blue)}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-left:7px;cursor:pointer;white-space:nowrap}
.src i{width:6px;height:6px;border-radius:99px;display:inline-block}
.src:hover{color:var(--blue-ink)}
.vc{display:inline-flex;align-items:baseline;flex-wrap:wrap}

/* ============================================================ overview */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:28px;align-items:center;padding:34px;border-radius:20px;border:1px solid var(--line);background:var(--hero),var(--bg2);overflow:hidden;position:relative}
.hero h1{margin:12px 0 14px;font-size:44px;line-height:1.06;letter-spacing:-.035em;font-weight:780}
.hero h1 span{background:linear-gradient(90deg,#4d8dff,#29c7b8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:16px;color:var(--ink2);max-width:560px;margin:0 0 24px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero .trust{display:flex;gap:22px;margin-top:26px;flex-wrap:wrap}
.hero .trust div{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.hero .trust svg{width:15px;height:15px;stroke:var(--teal);fill:none;stroke-width:2}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;pointer-events:none;animation:float 12s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,14px)}}
.preview{background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line3);border-radius:16px;padding:20px;box-shadow:var(--shadow-lg);position:relative}
.preview .pv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.preview .pv-prem{font-size:34px;font-weight:780;letter-spacing:-.03em}
.preview .pv-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.preview .pv-row div{background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-width:0}
.preview .pv-row b{display:block;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview .pv-row span{font-size:11px;color:var(--muted)}
.pv-bars{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.pv-bar{display:grid;grid-template-columns:110px minmax(0,1fr) 20px;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.pv-bar .tr{height:6px;border-radius:99px;background:var(--surface3);overflow:hidden}
.pv-bar .tr span{display:block;height:100%;border-radius:99px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.kpi{padding:16px 18px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kpi .k i{width:8px;height:8px;border-radius:99px}
.kpi .v{font-size:28px;font-weight:760;letter-spacing:-.03em;margin-top:8px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.donut-wrap{display:flex;gap:22px;align-items:center;padding:18px}
.legend2{display:flex;flex-direction:column;gap:10px;flex:1}
.legend2 div{display:flex;align-items:center;gap:10px;font-size:13px}
.legend2 i{width:10px;height:10px;border-radius:3px}
.legend2 b{margin-left:auto;font-variant-numeric:tabular-nums}
.tl{padding:6px 18px 14px}
.tli{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;padding:10px 0;position:relative}
.tli::before{content:"";position:absolute;left:8px;top:28px;bottom:-10px;width:2px;background:var(--line)}
.tli:last-child::before{display:none}
.tli .dot{width:18px;height:18px;border-radius:99px;display:grid;place-items:center;margin-top:2px}
.tli .dot i{width:8px;height:8px;border-radius:99px}
.tli .t{font-size:13px;font-weight:600}
.tli .d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tli .when{font-size:11.5px;color:var(--faint);white-space:nowrap}

/* ============================================================ application */
.app-shell{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:18px;align-items:start}
.stepper{padding:18px;position:sticky;top:84px}
.stepper h4{margin:0 0 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sti{display:flex;gap:12px;align-items:flex-start;padding:9px 8px;border-radius:9px;cursor:pointer;position:relative}
.sti:hover{background:var(--surface2)}
.sti:not(:last-child)::after{content:"";position:absolute;left:21px;top:38px;height:calc(100% - 26px);width:2px;background:var(--line)}
.sti.done:not(:last-child)::after{background:var(--good)}
.sti .c{width:28px;height:28px;border-radius:99px;border:2px solid var(--line3);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none;background:var(--surface);z-index:1;transition:all .2s}
.sti.on .c{border-color:var(--blue);color:#fff;background:var(--blue);box-shadow:0 0 0 5px var(--blue-soft)}
.sti.done .c{border-color:var(--good);background:var(--good);color:#fff}
.sti .l{font-weight:600;font-size:13px}.sti .d{font-size:11.5px;color:var(--muted)}
.prog{height:4px;border-radius:99px;background:var(--surface3);overflow:hidden;margin:6px 0 16px}
.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.form-card{padding:26px 28px}
.form-card .eyebrow{margin-bottom:6px}
.form-card h2{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
.form-card .intro{color:var(--muted);margin:0 0 22px}
.step{animation:stepin .25s ease}
@keyframes stepin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:620;color:var(--ink2);display:flex;align-items:center;gap:6px}
.field label .opt{font-weight:500;color:var(--faint)}
.field .help{font-size:11.5px;color:var(--muted)}
.field .err{font-size:11.5px;color:var(--bad-ink);display:none}
.field.invalid .err{display:block}
.field.invalid .in{border-color:var(--bad)}
.tipq{width:16px;height:16px;border-radius:99px;border:1px solid var(--line3);display:inline-grid;place-items:center;font-size:10px;color:var(--muted);cursor:help;position:relative}
.tipq:hover::after{content:attr(data-tip);position:absolute;bottom:140%;left:50%;transform:translateX(-50%);width:230px;background:#0b1220;color:#e2e8f0;font-size:11.5px;font-weight:500;line-height:1.45;padding:8px 10px;border-radius:8px;box-shadow:var(--shadow-lg);z-index:20}
.in{width:100%;border:1px solid var(--line3);background:var(--surface2);color:var(--ink);border-radius:9px;padding:10px 12px;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft);background:var(--surface)}
.in::placeholder{color:var(--faint)}
.affix{position:relative}
.affix .pre{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.affix .in{padding-left:28px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line3);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px;transition:all .15s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25);outline:1px solid var(--line3)}
.chipsel{display:flex;flex-wrap:wrap;gap:7px}
.chipsel button{border:1px solid var(--line3);background:var(--surface2);color:var(--ink2);border-radius:99px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:550;display:inline-flex;gap:6px;align-items:center;transition:all .15s}
.chipsel button.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.chipsel button.on::before{content:"✓";font-weight:800}
.cover-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cover{border:1px solid var(--line3);border-radius:12px;padding:14px;cursor:pointer;background:var(--surface2);display:flex;gap:12px;align-items:flex-start;transition:all .15s}
.cover:hover{border-color:var(--muted)}
.cover.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1px var(--blue) inset}
.cover .bx{width:18px;height:18px;border-radius:5px;border:2px solid var(--line3);flex:none;margin-top:2px;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800}
.cover.on .bx{background:var(--blue);border-color:var(--blue)}
.cover b{font-size:13.5px}.cover p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.combo{position:relative}
.combo .list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line3);border-radius:10px;box-shadow:var(--shadow-lg);max-height:260px;overflow:auto;z-index:15;padding:5px;display:none}
.combo.open .list{display:block}
.combo .opt{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:13px}
.combo .opt:hover,.combo .opt.hl{background:var(--surface2)}
.combo .opt small{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--blue)}
.form-foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--line2)}
.why-card{padding:18px;position:sticky;top:84px}
.why-card h4{margin:0 0 8px;font-size:13px;display:flex;gap:8px;align-items:center}
.why-card p{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.why-card .ex{background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:12px;font-size:12px;color:var(--ink2);font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap}
.review{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rv{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:14px}
.rv h5{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.rv h5 a{text-transform:none;letter-spacing:0;font-size:12px}
.rv dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.rv dt{color:var(--muted)}.rv dd{margin:0;text-align:right;font-weight:600}
.quick textarea{min-height:140px;resize:vertical}

/* ============================================================ run progress */
.runbox{padding:26px;max-width:760px;margin:30px auto}
.rsteps{display:flex;flex-direction:column;gap:4px;margin-top:18px}
.rs{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid transparent;transition:all .2s}
.rs.run{background:var(--blue-soft);border-color:var(--blue-line)}
.rs .c{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;border:2px solid var(--line3);font-weight:700;font-size:12px;color:var(--muted);flex:none}
.rs.run .c{border-color:var(--blue);color:var(--blue-ink)}
.rs.done .c{background:var(--good);border-color:var(--good);color:#fff}
.rs.fail .c{background:var(--bad);border-color:var(--bad);color:#fff}
.rs b{font-size:13.5px}.rs span{font-size:12px;color:var(--muted)}
.rs .t{margin-left:auto;font-size:12px;color:var(--faint)}
.bar-ind{height:3px;border-radius:3px;background:var(--surface3);overflow:hidden;position:relative}
.bar-ind::before{content:"";position:absolute;inset:0;width:35%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:3px;animation:ind 1.2s ease-in-out infinite}
@keyframes ind{from{left:-35%}to{left:100%}}

/* ============================================================ case workspace */
.case-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.case-head h1{margin:0;font-size:24px;letter-spacing:-.02em}
.case-head .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px;align-items:center}
.case-head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.decision{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.dec-l{padding:26px 28px;position:relative;overflow:hidden}
.dec-l .stamp{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:8px}
.dec-l .stamp i{width:9px;height:9px;border-radius:99px;background:currentColor}
.dec-l h2{margin:14px 0 6px;font-size:30px;letter-spacing:-.025em;line-height:1.15}
.dec-l .why{color:var(--ink2);font-size:14px;max-width:560px}
.dec-l .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.dec-quote{background:linear-gradient(135deg,rgba(37,198,133,.16),transparent 60%),var(--surface)}.dec-quote .stamp{color:var(--good-ink);background:var(--good-soft);border:1px solid var(--good-line)}
.dec-refer{background:linear-gradient(135deg,rgba(245,174,66,.16),transparent 60%),var(--surface)}.dec-refer .stamp{color:var(--warn-ink);background:var(--warn-soft);border:1px solid var(--warn-line)}
.dec-decline{background:linear-gradient(135deg,rgba(240,106,115,.18),transparent 60%),var(--surface)}.dec-decline .stamp{color:var(--bad-ink);background:var(--bad-soft);border:1px solid var(--bad-line)}
.dec-hold{background:linear-gradient(135deg,rgba(139,156,255,.18),transparent 60%),var(--surface)}.dec-hold .stamp{color:var(--hold);background:var(--hold-soft);border:1px solid var(--hold-line)}
.dec-r{padding:24px 26px;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.prem-lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prem-big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.qfacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qfacts div{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-width:0}
.qfacts span{display:block;font-size:11px;color:var(--muted)}
.qfacts b{font-size:13.5px;font-variant-numeric:tabular-nums;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qfacts b.na{color:var(--faint);font-weight:550;font-size:12px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rc b{font-size:26px;font-weight:780;font-variant-numeric:tabular-nums;line-height:1}
.ring .rc span{font-size:11px;color:var(--muted)}
.ring circle.fg{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.risk{display:flex;gap:20px;align-items:center;padding:18px}
.factors{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.fac{display:grid;grid-template-columns:110px minmax(0,1fr) 104px;gap:10px;align-items:center;font-size:12.5px}
.fac .meter{height:7px;border-radius:99px;background:var(--surface3);overflow:hidden}
.fac .meter span{display:block;height:100%;border-radius:99px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.alerts:empty{display:none}
.alert{display:flex;gap:12px;align-items:flex-start;border:1px solid;border-radius:12px;padding:11px 14px;font-size:13px}
.alert .ai{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;color:#fff}
.alert.bad{border-color:var(--bad-line);background:var(--bad-soft);color:var(--bad-ink)}.alert.bad .ai{background:var(--bad)}
.alert.warn{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn-ink)}.alert.warn .ai{background:var(--warn)}
.alert.good{border-color:var(--good-line);background:var(--good-soft);color:var(--good-ink)}.alert.good .ai{background:var(--good)}
.map-wrap{background:radial-gradient(ellipse at center,var(--surface2) 0%,var(--surface) 70%);border-bottom:1px solid var(--line2)}
.map-svg{width:100%;height:auto;display:block;user-select:none}
.map-svg .node{cursor:pointer;outline:none}
.map-svg .node .ring2{opacity:0;transition:opacity .15s}
.map-svg .node:hover .ring2,.map-svg .node.sel .ring2,.map-svg .node:focus-visible .ring2{opacity:1}
.map-svg .node .disc{transition:transform .15s;transform-origin:center;transform-box:fill-box}
.map-svg .node:hover .disc{transform:scale(1.07)}
.map-svg text{font-family:inherit}
.map-svg .pulse{animation:pulse 2.4s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.35);opacity:0}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:12px 18px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:99px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#fff}
.detail{border-top:1px solid var(--line2);padding:16px 18px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.detail h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.detail .sum{margin:6px 0 10px;color:var(--ink2)}
.detail ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--ink2)}
.issue{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line2);border-radius:9px;padding:8px 11px;background:var(--surface2);font-size:13px;margin-top:6px}
.who{font-size:11px;color:var(--faint);margin-top:10px}
.tip{position:fixed;pointer-events:none;background:#0b1220;color:#e2e8f0;padding:8px 11px;border-radius:9px;font-size:12px;z-index:60;max-width:250px;box-shadow:var(--shadow-lg);display:none;border:1px solid rgba(148,163,184,.2)}
.tip b{display:block}
.chat{display:flex;flex-direction:column;height:680px}
.chat-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.ava{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#29c7b8,#4d8dff);display:grid;place-items:center;flex:none}
.ava svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.chat-h b{font-size:14px}
.chat-h .st-dot{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.chat-h .st-dot i{width:7px;height:7px;border-radius:99px;background:var(--good)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg2)}
.m{max-width:88%;padding:10px 13px;border-radius:13px;font-size:13.5px;line-height:1.5;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.m.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.me{align-self:flex-end;background:linear-gradient(180deg,#5b97ff,#3f7ef5);color:#fff;border-bottom-right-radius:4px}
.m.note{align-self:center;background:none;color:var(--muted);font-size:12px;padding:2px 8px;text-align:center}
.m .meta{font-size:11.5px;color:var(--muted);margin-top:5px}
.m .upd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qnum{font-size:10.5px;font-weight:750;color:var(--teal);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.typing{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:13px;border-bottom-left-radius:4px;padding:11px 14px;display:flex;gap:4px;align-items:center}
.typing i{width:6px;height:6px;border-radius:99px;background:var(--muted);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.typing span{font-size:12px;color:var(--muted);margin-left:6px}
@keyframes bl{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.qr{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0;background:var(--surface)}
.qr button{border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue-ink);border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-weight:600;transition:transform .08s}
.qr button:active{transform:translateY(1px)}
.qr button.ghost{border-color:var(--line3);background:var(--surface2);color:var(--ink2)}
.compose{display:flex;gap:8px;padding:12px 14px 14px;background:var(--surface);border-top:1px solid var(--line2);border-radius:0 0 14px 14px}
.compose .in{padding:9px 12px}
.price-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px;border-bottom:1px solid var(--line2);background:linear-gradient(135deg,var(--blue-soft),transparent 70%)}
.price-head .big{font-size:30px;font-weight:780;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.formula{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.formula .tok{background:var(--surface2);border:1px solid var(--line3);border-radius:8px;padding:5px 10px;font-weight:650;font-variant-numeric:tabular-nums}
.formula .tok small{display:block;font-size:10.5px;font-weight:550;color:var(--muted)}
.formula .op{color:var(--muted);font-weight:700}
.psteps{padding:4px 18px}
.pstep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--line2)}
.pstep:last-child{border-bottom:0}
.pnum{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:750;font-size:13px;background:var(--blue-soft);color:var(--blue-ink);border:1px solid var(--blue-line)}
.pstep h5{margin:3px 0 6px;font-size:14px;font-weight:650}
.pstep p{margin:0;color:var(--ink2);font-size:13px}
.line{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:8px}
.line .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.line .amt.up{color:var(--bad-ink)}
.whyt{font-size:12.5px;color:var(--muted);margin-top:3px}
.bench{margin-top:10px;display:flex;flex-direction:column;gap:5px;max-width:540px}
.bench .row{display:grid;grid-template-columns:160px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bench .bar{height:7px;border-radius:99px;background:var(--surface3);overflow:hidden}
.bench .bar span{display:block;height:100%;border-radius:99px;background:var(--neutral-line)}
.bench .row.on{color:var(--ink);font-weight:650}
.bench .row.on .bar span{background:linear-gradient(90deg,var(--blue),var(--teal))}
.load{border:1px solid var(--line2);border-left:3px solid var(--bad);border-radius:10px;padding:10px 12px;background:var(--surface2);margin-top:8px}
.load.disc{border-left-color:var(--warn)}
.load .lt{display:flex;justify-content:space-between;gap:10px;align-items:center}
.load b{font-size:13px}
.price-foot{padding:14px 18px;border-top:1px solid var(--line2);background:var(--surface2);border-radius:0 0 14px 14px}
.price-foot summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink2)}
.price-foot ul{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.flip{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2);font-size:13px}
.flip:last-child{border-bottom:0}
.cov{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:16px 18px}
.covi{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:14px}
.covi .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.covi b{font-size:13.5px}.covi p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.covi .amt{font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line2);overflow-x:auto}
.tab{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--blue)}
.tab .n{font-size:11px;background:var(--surface3);color:var(--muted);border-radius:6px;padding:0 6px}
.tab.on .n{background:var(--blue-soft);color:var(--blue-ink)}
.cmp tr.row-bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.cmp tr.row-warn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.cmp tr.row-good td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.cmp td{vertical-align:top}
.cmp td:first-child{font-weight:600;white-space:nowrap}
.cmp .multi{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:16px 18px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2);display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.tile:hover{border-color:var(--line3)}
.tile .th{display:flex;gap:10px;align-items:center}
.tile .tf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.tile .tf span{font-size:11px;color:var(--muted);background:var(--surface3);border-radius:6px;padding:1px 7px}
.news{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
.newsi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;background:var(--surface2)}
.newsi.counted{border-color:var(--bad-line);background:var(--bad-soft)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2)}
.filters .in{max-width:320px}
.co{display:flex;gap:11px;align-items:center}
.co .av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:750;font-size:12px;color:#fff;flex:none}
.co b{font-size:13px;display:block}.co span{font-size:11.5px;color:var(--muted);display:block;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;backdrop-filter:blur(2px)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--surface);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:50;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line2)}
.drawer .dh h3{margin:0;font-size:15px}
.drawer .db{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
pre.q{white-space:pre-wrap;font:12px ui-monospace,Menlo,monospace;background:var(--surface2);border:1px solid var(--line2);padding:10px;border-radius:8px;margin:0;color:var(--ink2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#0b1220;color:#e2e8f0;border:1px solid rgba(148,163,184,.25);padding:11px 16px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;z-index:70;pointer-events:none;max-width:90vw;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#printQuote{display:none}
@media print{
  body{background:#fff!important;color:#000}
  body::before,.nav,main,.drawer,.scrim,.toast,.tip{display:none!important}
  #printQuote{display:block!important;font:12px/1.5 Inter,Arial,sans-serif;color:#111;padding:10mm}
  #printQuote h1{font-size:20px;margin:0 0 4px}#printQuote h2{font-size:14px;margin:18px 0 6px;border-bottom:1px solid #ccc;padding-bottom:4px}
  #printQuote table td{border-bottom:1px solid #ddd;padding:5px 6px;color:#111;font-size:12px}
}
@media (max-width:1240px){.app-shell{grid-template-columns:240px minmax(0,1fr)}.why-col{display:none}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.g2,.g2b,.hero,.decision{grid-template-columns:1fr}.dec-r{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:820px){
  .nav-in{padding:10px 14px;gap:12px;flex-wrap:wrap}.links{order:3;width:100%;overflow-x:auto}.status{display:none}
  main{padding:16px 14px 60px}.hero{padding:22px}.hero h1{font-size:32px}
  .app-shell{grid-template-columns:1fr}.stepper{position:static}.stepper .sti .d{display:none}
  .stepper .steps-list{display:flex;overflow-x:auto;gap:4px}.stepper .sti::after{display:none}
  .fields,.review,.cover-grid,.cov,.qfacts{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-card{padding:20px}.risk{flex-direction:column;align-items:stretch}.fac{grid-template-columns:90px minmax(0,1fr) 92px}
  .case-head .act{margin-left:0}.chat{height:560px}.prem-big{font-size:36px}
}
/* watcher + delete */
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.del-x{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:7px;font-size:13px}
.del-x:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.wc{padding:16px 20px;border-bottom:1px solid var(--line,rgba(127,127,127,.18));display:flex;flex-direction:column;gap:10px}
.wc:last-child{border-bottom:0}
.wc-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wc-h b{font-size:14.5px}
.wc-h .act{margin-left:auto;display:flex;gap:6px}
